services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/app/data/idpdb;DB_CLOSE_ON_EXIT=FALSE"
    volumes:
      - backend-data:/app/data
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
volumes:
  backend-data:
