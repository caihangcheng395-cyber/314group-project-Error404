spring:
  application:
    name: csit314-interior-design-platform
  datasource:
    url: jdbc:h2:file:./data/idpdb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

  # Keep the existing file-backed H2 setup for local coursework development.
server:
  port: 8080
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
app:
  demo-login-enabled: ${APP_DEMO_LOGIN_ENABLED:true}
  demo-seed-enabled: ${APP_DEMO_SEED_ENABLED:true}
