server:
  port: 8080
spring:
  application:
    name: csit314-interior-design-platform
  datasource:
    url: jdbc:h2:file:./data/idpdb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
