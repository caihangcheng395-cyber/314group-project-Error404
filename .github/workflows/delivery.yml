name: CD — Publish versioned container images
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify backend before delivery
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Verify frontend before delivery
        run: |
          cd frontend
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Compute lowercase image names
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend image
        run: |
          docker build -t "$IMAGE_BASE-backend:$GITHUB_REF_NAME" ./backend
          docker push "$IMAGE_BASE-backend:$GITHUB_REF_NAME"
      - name: Build and publish frontend image
        run: |
          docker build -t "$IMAGE_BASE-frontend:$GITHUB_REF_NAME" ./frontend
          docker push "$IMAGE_BASE-frontend:$GITHUB_REF_NAME"
